name: container-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push production image
        id: buildpush
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/genhopie/relateanything-runtime:${{ github.sha }}
      - name: Verify registry digest
        id: publish
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/genhopie/relateanything-runtime:${{ github.sha }}"
          DIGEST="${{ steps.buildpush.outputs.digest }}"
          if [ -z "${DIGEST}" ]; then
            echo "build-push-action did not return a registry digest"
            exit 1
          fi
          case "${DIGEST}" in
            sha256:*) ;;
            *)
              echo "digest is not an immutable sha256 reference: ${DIGEST}"
              exit 1
              ;;
          esac
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "## Container digest (registry)" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Set Base Admin \`content_visual_inference_runtime_container_revision\` to the digest value exactly." >> "$GITHUB_STEP_SUMMARY"
